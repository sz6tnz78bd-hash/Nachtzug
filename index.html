<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b10"><title>Nachtzug</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 18%,#172331,#070b10 58%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef3f7;display:flex;justify-content:center}
main{width:min(680px,100%);padding:calc(35px + env(safe-area-inset-top)) 22px 35px;text-align:center}h1{font-size:42px;margin:10px 0 4px}.sub{opacity:.65;margin-bottom:34px}
.card{background:#101821cc;border:1px solid #263444;border-radius:24px;padding:24px;box-shadow:0 18px 60px #0008}
button{width:100%;border:0;border-radius:18px;padding:19px;font-size:20px;font-weight:750;background:#d9e6ee;color:#071018;margin:5px 0 12px}
button.stop{background:#293746;color:#eef3f7}.status{min-height:58px;margin-top:16px;color:#9fb0bd;font-size:14px;line-height:1.5}
.small{font-size:12px;color:#71828e;line-height:1.55;margin-top:22px}
</style></head><body><main>
<h1>🚆 Nachtzug</h1><div class="sub">Jede Nacht eine andere Fahrt.</div>
<div class="card"><button id="start">NACHTFAHRT STARTEN</button><button id="stop" class="stop" hidden>FAHRT BEENDEN</button>
<div id="status" class="status">Eine ruhige, durchgehende Fahrt. Lautstärke regelst du am iPhone.</div></div>
<div class="small">Echte Zugaufnahme · keine künstlichen Schienengeräusche · keine hörbaren Schnittpausen.</div>
<script>
const FILE="TRNInt_Car%20micheline%20(ID%200212)_BigSoundBank.com.wav";
const a=[new Audio(),new Audio()];
a.forEach(x=>{x.preload="auto";x.playsInline=true;x.src=FILE});
let running=false, active=0, timer=0, fade=0, generation=0;
const status=document.querySelector("#status"), start=document.querySelector("#start"), stop=document.querySelector("#stop");
function waitMeta(x){return new Promise((res,rej)=>{if(x.readyState>=1)return res();let to=setTimeout(()=>rej(Error("timeout")),10000);x.addEventListener("loadedmetadata",()=>{clearTimeout(to);res()},{once:true});x.addEventListener("error",()=>{clearTimeout(to);rej(Error("audio"))},{once:true})})}
function range(d,avoid=-999){
 const margin=Math.min(12,d*.08), min=margin, max=Math.max(min+1,d-margin-55);
 let p=min+Math.random()*Math.max(1,max-min);
 for(let n=0;n<8 && Math.abs(p-avoid)<35;n++)p=min+Math.random()*Math.max(1,max-min);
 return p;
}
async function prime(){
 a.forEach(x=>{x.load()}); await Promise.all(a.map(waitMeta));
}
async function playAt(i,pos,volume){
 const x=a[i]; x.pause(); x.currentTime=Math.max(0,Math.min(pos,x.duration-2)); x.playbackRate=1; x.volume=volume;
 await x.play();
}
function schedule(pos){
 if(!running)return;
 // Crossfade begins long before the source segment ends. Both copies are already buffered.
 const hold=48+Math.random()*34;
 timer=setTimeout(()=>transition(pos),hold*1000);
}
async function transition(oldPos){
 if(!running)return;
 const my=++generation, next=1-active, old=active, d=a[old].duration;
 const np=range(d,oldPos);
 try{
   await playAt(next,np,0);
   if(!running||my!==generation)return;
   const ms=18000+Math.random()*8000, steps=120; let k=0;
   clearInterval(fade);
   fade=setInterval(()=>{
     if(!running||my!==generation){clearInterval(fade);return}
     k++; let t=k/steps;
     // equal-power crossfade: avoids the dip/silence of a linear fade
     a[old].volume=Math.cos(t*Math.PI/2)*0.72;
     a[next].volume=Math.sin(t*Math.PI/2)*0.72;
     if(k>=steps){
       clearInterval(fade); a[old].pause(); a[old].volume=0; active=next;
       status.textContent="Nachtfahrt läuft · die Strecke verändert sich langsam weiter.";
       schedule(np);
     }
   },ms/steps);
 }catch(e){status.textContent="Die Zugaufnahme konnte nicht gestartet werden."; running=false; start.hidden=false;stop.hidden=true}
}
async function go(){
 if(running)return;
 running=true; generation++; start.hidden=true;stop.hidden=false; status.textContent="Nachtfahrt wird vorbereitet …";
 try{
   await prime(); const p=range(a[0].duration); active=0;
   // 0.72 gives headroom; the WAV itself sounded hot on iPhone.
   await playAt(0,p,0.72); a[1].volume=0;
   status.textContent="Nachtfahrt läuft · durchgehend und ohne künstliche Effekte.";
   schedule(p);
 }catch(e){running=false;start.hidden=false;stop.hidden=true;status.textContent="Die Zugaufnahme konnte nicht geladen werden."}
}
function end(){
 running=false;generation++;clearTimeout(timer);clearInterval(fade);a.forEach(x=>{x.pause();x.volume=0});
 start.hidden=false;stop.hidden=true;status.textContent="Nachtfahrt beendet.";
}
start.onclick=go;stop.onclick=end;
</script></main></body></html>
