<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030506">
<title>Nachtzug</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030506;color:#e6ecee;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color-scheme:dark}
main{max-width:520px;margin:auto;padding:42px 22px 40px}
h1{text-align:center;font-weight:300;letter-spacing:.25em;font-size:30px;margin:0}
.sub{text-align:center;color:#66747a;font-size:11px;letter-spacing:.16em;margin:7px 0 27px}
.window{height:150px;border:1px solid #263238;border-radius:22px;background:linear-gradient(#040709,#0a1013);box-shadow:inset 0 0 45px #000;position:relative;overflow:hidden}
.track{position:absolute;left:0;right:0;bottom:37px;height:1px;background:#263136}
.light{position:absolute;bottom:51px;width:4px;height:4px;border-radius:50%;background:#d6bd7f;animation:pass 14s linear infinite}
@keyframes pass{from{left:105%}to{left:-5%}}
#status{text-align:center;color:#87949a;font-size:13px;min-height:52px;padding:18px 4px 8px}
button{width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:650;margin:6px 0}
#start{background:#e2e9eb;color:#101315}
#test{background:#182126;color:#d5dfe2;border:1px solid #334148}
.panel{margin-top:14px;padding:17px;background:#0b1013;border:1px solid #20292e;border-radius:18px}
.row{margin-bottom:18px}.row:last-child{margin-bottom:3px}
.label{display:flex;justify-content:space-between;color:#c0c9cd;font-size:13px;margin-bottom:8px}.v{color:#718087}
input{width:100%;accent-color:#aab8be}
.note{text-align:center;color:#56636a;font-size:11px;line-height:1.5;margin-top:17px}
</style>
</head>
<body><main>
<h1>NACHTZUG</h1><div class="sub">RÄDER · SCHIENEN · NACHT</div>
<div class="window"><div class="track"></div><i class="light"></i></div>
<div id="status">Zuerst „KLACK TESTEN“ drücken.</div>
<button id="test">KLACK TESTEN</button>
<button id="start">Fahrt beginnen</button>

<div class="panel">
<div class="row"><div class="label"><span>Schienenstöße</span><span class="v" id="kv">kräftig</span></div><input id="klack" type="range" min="0" max="100" value="82"></div>
<div class="row"><div class="label"><span>Fahrtempo</span><span class="v" id="tv">Nachtzug</span></div><input id="tempo" type="range" min="0" max="100" value="46"></div>
<div class="row"><div class="label"><span>Rollen</span><span class="v">leise</span></div><input id="roll" type="range" min="0" max="100" value="26"></div>
</div>
<div class="note">Keine Audiodatei und kein kompletter Loop.<br>Die Radstöße werden einzeln in Echtzeit erzeugt.</div>
</main>
<script>
let ac=null, master=null, running=false, beatTimer=null, variationTimer=null, rollNodes=[];

const $=id=>document.getElementById(id);

async function ensureAudio(){
 if(!ac || ac.state==="closed"){
   ac=new (window.AudioContext||window.webkitAudioContext)();
   master=ac.createGain();
   master.gain.value=.82;
   master.connect(ac.destination);
 }
 if(ac.state!=="running") await ac.resume();
}

function thump(t, strength=1, pan=0){
 // BODY: a short low wheel/rail impact, deliberately tonal so iPhone speakers reproduce it.
 const o=ac.createOscillator(), g=ac.createGain();
 o.type="sine";
 o.frequency.setValueAtTime(165,t);
 o.frequency.exponentialRampToValueAtTime(72,t+.095);
 let a=(.075 + (+$("klack").value/100)*.16)*strength;
 g.gain.setValueAtTime(.0001,t);
 g.gain.exponentialRampToValueAtTime(Math.max(.001,a),t+.006);
 g.gain.exponentialRampToValueAtTime(.0001,t+.12);
 o.connect(g).connect(master); o.start(t); o.stop(t+.13);

 // CLICK: mechanical flange/joint snap, generated from a tiny oscillator burst (not noise).
 const c=ac.createOscillator(), cg=ac.createGain();
 c.type="triangle";
 c.frequency.setValueAtTime(820+Math.random()*220,t);
 c.frequency.exponentialRampToValueAtTime(330,t+.035);
 cg.gain.setValueAtTime(.0001,t);
 cg.gain.exponentialRampToValueAtTime(.10*strength,t+.002);
 cg.gain.exponentialRampToValueAtTime(.0001,t+.055);
 c.connect(cg).connect(master); c.start(t); c.stop(t+.06);
}

function bogie(t, strength=1){
 // Two axles: the characteristic "ka-DACK".
 thump(t,.72*strength);
 thump(t+.118+Math.random()*.012,1.0*strength);
}

async function testKlack(){
 await ensureAudio();
 $("status").textContent="Jetzt müssen vier deutliche Radstöße zu hören sein.";
 let t=ac.currentTime+.08;
 bogie(t,1.25);
 bogie(t+.52,1.15);
}

function startRollingBed(){
 // Low tonal carriage vibration. No broadband hiss.
 const freqs=[43,57,76];
 freqs.forEach((f,i)=>{
   const o=ac.createOscillator(), g=ac.createGain(), l=ac.createOscillator(), lg=ac.createGain();
   o.type=i===2?"triangle":"sine"; o.frequency.value=f;
   g.gain.value=(i===0?.018:i===1?.011:.004)*(+$("roll").value/26);
   l.frequency.value=.07+i*.031; lg.gain.value=.003;
   l.connect(lg).connect(g.gain); o.connect(g).connect(master);
   o.start(); l.start(); rollNodes.push({o,g,l,lg});
 });
}

function stopRollingBed(){
 rollNodes.forEach(n=>{try{n.o.stop();n.l.stop()}catch(e){}});
 rollNodes=[];
}

function scheduleBeat(){
 if(!running)return;
 const speed=+$("tempo").value;
 // About 0.43–0.92 s between bogie groups, with small natural drift.
 const base=.94-speed*.0060;
 const interval=Math.max(.34,base)*(0.91+Math.random()*.18);
 const t=ac.currentTime+.025;

 bogie(t,.86+Math.random()*.16);

 // Sometimes the rear bogie is heard as a softer second pair.
 if(Math.random()<.48){
   const gap=.30+Math.random()*.07;
   bogie(t+gap,.48+Math.random()*.18);
 }
 beatTimer=setTimeout(scheduleBeat,interval*1000);
}

function scheduleVariation(){
 if(!running)return;
 const delay=18000+Math.random()*30000;
 variationTimer=setTimeout(()=>{
   if(!running)return;
   const t=ac.currentTime+.05;
   // A turnout: several irregular, stronger rail impacts.
   [0,.13,.29,.43,.68,.83].forEach((d,i)=>thump(t+d,(i===1||i===4)?1.55:1.12));
   $("status").textContent="Weichen rumpeln unter dem Wagen …";
   setTimeout(()=>{if(running)$("status").textContent="Der Nachtzug rollt weiter …"},2600);
   scheduleVariation();
 },delay);
}

async function toggle(){
 if(running){
   running=false; clearTimeout(beatTimer);clearTimeout(variationTimer);stopRollingBed();
   $("start").textContent="Fahrt beginnen";$("status").textContent="Der Zug steht.";
   return;
 }
 await ensureAudio();
 running=true; startRollingBed(); scheduleBeat(); scheduleVariation();
 $("start").textContent="Fahrt beenden";
 $("status").textContent="Räder auf den Schienen … ka-dack … ka-dack …";
}

$("test").onclick=testKlack;
$("start").onclick=toggle;

$("klack").oninput=e=>{
 const v=+e.target.value;$("kv").textContent=v<30?"leise":v<65?"mittel":"kräftig";
};
$("tempo").oninput=e=>{
 const v=+e.target.value;$("tv").textContent=v<30?"langsam":v<70?"Nachtzug":"schnell";
};
$("roll").oninput=e=>{
 if(rollNodes.length){
   const scale=+e.target.value/26;
   rollNodes.forEach((n,i)=>n.g.gain.value=(i===0?.018:i===1?.011:.004)*scale);
 }
};
</script></body></html>
